[build]
  command = "python3 build.py"
  publish = "public"

# Anciennes adresses du site WordPress -> nouvelles pages (référencement conservé)
[[redirects]]
  from = "/fr/accueil/"
  to = "/fr/"
  status = 301
[[redirects]]
  from = "/fr/a-propos/"
  to = "/fr/maison/"
  status = 301
[[redirects]]
  from = "/fr/restaurant/"
  to = "/fr/sejours/"
  status = 301
[[redirects]]
  from = "/fr/aventures/"
  to = "/fr/sejours/"
  status = 301
[[redirects]]
  from = "/fr/contact/"
  to = "/fr/reserver/"
  status = 301
[[redirects]]
  from = "/about/"
  to = "/en/house/"
  status = 301
[[redirects]]
  from = "/rooms/*"
  to = "/en/house/"
  status = 301
[[redirects]]
  from = "/restaurant/"
  to = "/en/stays/"
  status = 301
[[redirects]]
  from = "/adventures/"
  to = "/en/stays/"
  status = 301
[[redirects]]
  from = "/contact/"
  to = "/en/book/"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/en/valley/"
  status = 301
[[redirects]]
  from = "/fr/rachid/"
  to = "/fr/maison/#hotes"
  status = 301
[[redirects]]
  from = "/en/rachid/"
  to = "/en/house/#hotes"
  status = 301
[[redirects]]
  from = "/de/rachid/"
  to = "/de/haus/#hotes"
  status = 301
[[redirects]]
  from = "/fr/journal/*"
  to = "/fr/vallee/"
  status = 301
[[redirects]]
  from = "/en/journal/*"
  to = "/en/valley/"
  status = 301
[[redirects]]
  from = "/de/journal/*"
  to = "/de/tal/"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
